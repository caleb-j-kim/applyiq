spring:
  application:
    name: applyiq-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:applyiq}
    username: ${DB_USERNAME:applyiq}
    password: ${DB_PASSWORD:applyiq}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    enabled: ${DEMO_SEED_ENABLED:true}
    email: ${DEMO_EMAIL:demo@applyiq.com}
    password: ${DEMO_PASSWORD:demo1234}
  aws:
    region: ${AWS_REGION:us-east-1}
    s3:
      resume-bucket: ${AWS_S3_RESUME_BUCKET:applyiq-resumes-dev}
  preview:
    email: ${PREVIEW_EMAIL:caleb.kim@applyiq.com}
    password: ${PREVIEW_PASSWORD:demo1234}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
  email:
    # Where Google sends the consent popup back to. Must exactly match the redirect URI
    # registered on the Google OAuth client.
    redirect-uri: ${EMAIL_OAUTH_REDIRECT_URI:http://127.0.0.1:8080/api/email/oauth/callback}
    # Encrypts stored OAuth tokens. Falls back to the JWT secret so local dev works out of the
    # box; give it its own value in production. Changing it invalidates every stored connection.
    token-key: ${EMAIL_TOKEN_KEY:${app.jwt.secret}}
    sync-interval-ms: ${EMAIL_SYNC_INTERVAL_MS:900000}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
