services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-applyiq}
      POSTGRES_USER: ${DB_USERNAME:-applyiq}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-applyiq}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-applyiq}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-applyiq}
      DB_USERNAME: ${DB_USERNAME:-applyiq}
      DB_PASSWORD: ${DB_PASSWORD:-applyiq}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SERVER_PORT: 8080
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-true}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@applyiq.com}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_RESUME_BUCKET: ${AWS_S3_RESUME_BUCKET:-applyiq-resumes-dev}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      PREVIEW_EMAIL: ${PREVIEW_EMAIL:-caleb.kim@applyiq.com}
      PREVIEW_PASSWORD: ${PREVIEW_PASSWORD:-demo1234}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      EMAIL_TOKEN_KEY: ${EMAIL_TOKEN_KEY:-}
      EMAIL_OAUTH_REDIRECT_URI: ${EMAIL_OAUTH_REDIRECT_URI:-http://127.0.0.1:8080/api/email/oauth/callback}
      # "Today" for follow-up day counts and sent dates. Without it the container runs on UTC,
      # so evenings in US time already count as tomorrow.
      TZ: ${TZ:-America/Chicago}
      # Set to DEBUG to log what the email sync decides for each message (includes subjects).
      LOGGING_LEVEL_COM_APPLYIQ_EMAIL: ${LOGGING_LEVEL_COM_APPLYIQ_EMAIL:-INFO}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  db-data:
